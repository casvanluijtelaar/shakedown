name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle-check:
    name: OKF bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install PyYAML==6.0.3
      - run: python3 tools/okf_check.py
