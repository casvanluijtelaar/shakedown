name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle-check:
    name: OKF bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install PyYAML==6.0.3
      - run: python3 tools/okf_check.py

  # The gates of NFR-MT-03 that need no game. Versions looked up on 2026-11-05 (spec/07-tech-stack.md).
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy && rustup default 1.99.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The tests of the release packaging and the one-line install (DST-01, DST-03, NFR-LG-04).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - if: runner.os == 'Windows'
        run: powershell -NoProfile -File tools/test_install.ps1

  hemtt-check:
    name: HEMTT check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The action reads GITHUB_TOKEN from the environment to list HEMTT's releases with an
      # authenticated request, which keeps it clear of the unauthenticated API rate limit.
      - uses: arma-actions/hemtt@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v1.23.1
      - run: hemtt check
        working-directory: addon
      - run: hemtt check
        working-directory: fixtures/skd_fixture
      - run: hemtt check
        working-directory: fixtures/skd_fixture_cba
