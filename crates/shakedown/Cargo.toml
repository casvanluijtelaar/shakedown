[package]
name = "shakedown"
description = "The shakedown command: the runner, the command line and, later, the MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
shakedown-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
getrandom = "0.4.3"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
