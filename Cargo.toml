[workspace]
resolver = "3"
members = ["crates/shakedown", "crates/shakedown-ext", "crates/shakedown-protocol"]

[workspace.package]
version = "0.0.8"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
shakedown-protocol = { path = "crates/shakedown-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
debug = 1
