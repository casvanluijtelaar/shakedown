# The M1 demo project: arma-grappling-hook checks rewritten as Shakedown checks
# (plan/milestones/m01.md). It loads CBA_A3 from the Steam Workshop and the arma-grappling-hook
# build that HEMTT leaves in that repository's .hemttout\build; Shakedown does not build it. For
# the M6 demo, reload watches the mod's addons folder, and a game-restart reload runs its own
# `hemtt build` while no game process runs (RLD-06, docs/reloading.md).
game = 'C:\Program Files (x86)\Steam\steamapps\common\Arma 3'
checks = "checks"

[mods.cba]
path = 'C:\Program Files (x86)\Steam\steamapps\workshop\content\107410\450814997'
patch = "cba_main"

[mods.agh]
path = 'C:\Users\Shadow\Documents\arma-grappling-hook\.hemttout\build'
patch = "agh_main"
source = 'C:\Users\Shadow\Documents\arma-grappling-hook\addons'
prefix = 'z\agh\addons'
rebuild = 'cd /d C:\Users\Shadow\Documents\arma-grappling-hook && hemtt build'

[setups.sp]
mode = "singleplayer"
mods = ["cba", "agh"]

[setups.dedicated]
mode = "dedicated"
clients = 2
mods = ["cba", "agh"]

# The M8 demo's setup: `shakedown run --setup dedicated-2` runs every check in a session it
# starts and stops (docs/unattended-runs.md).
[setups.dedicated-2]
mode = "dedicated"
clients = 2
mods = ["cba", "agh"]
